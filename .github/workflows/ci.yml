name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        # Warnings fail the build on Linux (the platform it's developed on);
        # elsewhere they're reported but don't block.
        run: cargo clippy --workspace --all-targets ${{ runner.os == 'Linux' && '-- -D warnings' || '' }}
      - name: Test
        run: cargo test --workspace
      - name: Build app
        run: cargo build --release -p loopcraft-app
