name: Feature request
description: Something Live does that LoopCraft should (check docs/ROADMAP.md first)
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: Describe the workflow, not just the feature name.
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap entry
      description: The matching row in docs/ROADMAP.md, if there is one
