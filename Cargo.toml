[workspace]
resolver = "2"
members = [
    "crates/loopcraft-core",
    "crates/loopcraft-dsp",
    "crates/loopcraft-engine",
    "crates/loopcraft-io",
    "crates/loopcraft-plugin",
    "crates/loopcraft-cli",
    "crates/loopcraft-app",
]
default-members = [
    "crates/loopcraft-core",
    "crates/loopcraft-dsp",
    "crates/loopcraft-engine",
    "crates/loopcraft-io",
    "crates/loopcraft-plugin",
    "crates/loopcraft-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baph0card/loopcraft"
authors = ["LoopCraft contributors"]
rust-version = "1.88"

[workspace.dependencies]
loopcraft-core = { path = "crates/loopcraft-core" }
loopcraft-dsp = { path = "crates/loopcraft-dsp" }
loopcraft-engine = { path = "crates/loopcraft-engine" }
loopcraft-io = { path = "crates/loopcraft-io" }
loopcraft-plugin = { path = "crates/loopcraft-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
midly = "0.5"
rtrb = "0.4"
clap-sys = "0.5"
libloading = "0.9"
cpal = "0.18"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
anyhow = "1"
rustfft = "6"
symphonia = { version = "0.6", features = ["mp3", "aiff"] }
midir = "0.11"
flacenc = "0.5"
vst3 = "0.3"
libc = "0.2"
x11rb = "0.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[workspace.lints.clippy]
# DSP state machines expose `next()` for the next sample; they are not iterators.
should_implement_trait = "allow"
too_many_arguments = "allow"
field_reassign_with_default = "allow"
# DSP loops index several buffers in lockstep; ranges read clearer there.
needless_range_loop = "allow"
# Recordings travel between threads as boxes on purpose (one pointer per ring slot).
vec_box = "allow"
boxed_local = "allow"
